<div id="start-screen">

  <h1>Colorado Explorer</h1>

  <h2>Can you figure out where you are?</h2>

  <p>
    Explore different places in Colorado.
    Use clues from the landscape to identify the region
    and place your best guess on the map.
  </p>

  <div class="start-form">

    <label for="student-name">
      <strong>Your Name</strong>
    </label>

    <input
      type="text"
      id="student-name"
      placeholder="Enter your name">


    <label for="student-class">
      <strong>Your Class</strong>
    </label>

    <select id="student-class">
      <option value="">Choose your class</option>
      <option value="Clark">Dr. Clark</option>
      <option value="Co-Teacher">Mr. Velasquez</option>
    </select>


    <h3>Choose Your Challenge</h3>

    <div class="mode-buttons">

      <button
        type="button"
        onclick="selectGameMode(this, 'explore')">

        <strong>Explore Colorado</strong><br>
        <span>
          Practice with 5 locations.
          Hints are available.
        </span>

      </button>


      <button
        type="button"
        onclick="selectGameMode(this, 'post')">

        <strong>Colorado Post-Test</strong><br>
        <span>
          Try 5 new locations without hints.
        </span>

      </button>

    </div>


    <div id="start-warning"></div>


    <button
      id="start-button"
      onclick="startGame()">

      Start Exploring

    </button>

  </div>

</div>
